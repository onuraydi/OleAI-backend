services:
  # 1. SQL Server Veritabanı
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oleai_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - oleai_network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. .NET 9 Backend API
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oleai_backend
    depends_on:
      sql-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    networks:
      - oleai_network

networks:
  oleai_network:
    driver: bridge

volumes:
  sql_data: