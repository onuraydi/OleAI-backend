services:
  nginx:
    image: nginx:alpine
    container_name: oleai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - grafana
    networks:
      - oleai_public
      - oleai_internal
      - monitoring
    restart: unless-stopped

  frontend:
    image: ${ACR_LOGIN_SERVER}/oleai-frontend:latest
    container_name: oleai_frontend
    networks:
      - oleai_public
      - oleai_internal
    restart: unless-stopped

  backend:
    image: ${ACR_LOGIN_SERVER}/oleai-backend:latest
    container_name: oleai_backend
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - redis
    networks:
      - oleai_internal
      - monitoring
    restart: unless-stopped

  ai:
    image: ${ACR_LOGIN_SERVER}/oleai-ai:latest
    container_name: oleai_ai
    env_file:
      - .env.prod
    networks:
      - oleai_internal
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: oleai_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - oleai_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: oleai_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - oleai_internal
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: oleai_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring
      - oleai_internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: oleai_grafana
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

networks:
  oleai_public:
    driver: bridge
  oleai_internal:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

volumes:
  ollama_data:
  redis_data:
  prometheus_data:
  grafana_data:
