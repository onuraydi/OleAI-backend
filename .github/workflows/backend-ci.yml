name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-analyze:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube analizi için tüm commit geçmişi (Blame/History) gereklidir.

      # SonarScanner, Java Runtime Environment (JRE) gerektirir
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # .NET SonarScanner aracını global olarak kur
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Cache NuGet Packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ./src/OleAI.Backend.sln

# 1. SonarQube analizini başlat
      - name: SonarQube Begin
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
          /k:"onuraydi_OleAI-backend" \
          /o:"onuraydi" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
          /d:sonar.coverage.exclusions="**/Program.cs,**/Migrations/**" \
          /d:sonar.exclusions="**/Migrations/**" \
          /d:sonar.qualitygate.wait=true

      # 2. Kodu Derle
      - name: Build
        run: dotnet build ./src/OleAI.Backend.sln --configuration Release --no-restore

      # 3. Testleri Koş ve Code Coverage
      - name: Run Tests
        run: |
          dotnet test ./src/OleAI.Backend.sln \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger trx \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage \
          -m:1 \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # 4. SonarQube analizini bitir ve sonuçları sunucuya gönder
      - name: SonarQube End
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
