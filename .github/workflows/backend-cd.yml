name: Backend CD Pipeline

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/oleai-backend:latest

      - name: Copy files via ssh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx,monitoring"
          target: "~/deploy"

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/deploy
            
            # Create .env.prod file
            cat <<EOF > .env.prod
            ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
            Env_SerilogConnectionString=${{ secrets.SQL_CONNECTION_STRING }}
            ConnectionStrings__OleAIConnectionString=${{ secrets.SQL_CONNECTION_STRING }}
            ConnectionStrings__Redis=redis:6379,abortConnect=false,connectTimeout=10000
            TokenOptions__Audience=OleAIUsers
            TokenOptions__Issuer=OleAIBackend
            TokenOptions__SecurityKey=${{ secrets.JWT_SECURITY_KEY }}
            TokenOptions__AccessTokenExpiration=15
            TokenOptions__RefreshTokenExpiration=7
            TokenOptions__MaxActiveTokens=5
            CloudinarySettings__CloudName=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CloudinarySettings__ApiKey=${{ secrets.CLOUDINARY_API_KEY }}
            CloudinarySettings__ApiSecret=${{ secrets.CLOUDINARY_API_SECRET }}
            MailSettings__Server=${{ secrets.MAIL_SERVER }}
            MailSettings__Port=${{ secrets.MAIL_PORT }}
            MailSettings__SenderFullName=${{ secrets.MAIL_SENDER_NAME }}
            MailSettings__SenderEmail=${{ secrets.MAIL_SENDER_EMAIL }}
            MailSettings__UserName=${{ secrets.MAIL_USERNAME }}
            MailSettings__Password=${{ secrets.MAIL_PASSWORD }}
            SecuritySettings__DefaultRoleId=${{ secrets.SECURITY_DEFAULT_ROLE_ID }}
            SecuritySettings__AdminRoleId=${{ secrets.SECURITY_ADMIN_ROLE_ID }}
            OllamaSettings__BaseUrl=http://ollama:11434
            AiService__BaseUrl=http://ai:8000
            AiService__ApiKey=${{ secrets.AI_SERVICE_API_KEY }}
            Firebase__CredentialsJson='${{ secrets.FIREBASE_CREDENTIALS_JSON }}'
            EOF
            
            # Login to ACR on the VM
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            
            # Create dummy certs if they don't exist to prevent Nginx from failing to start
            mkdir -p nginx/certs
            if [ ! -f nginx/certs/fullchain.pem ]; then
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout nginx/certs/privkey.pem -out nginx/certs/fullchain.pem -subj "/C=TR/ST=Istanbul/L=Istanbul/O=OleAI/CN=api.oleai.com"
            fi
            
            # Export variable so docker compose can read it for the image tags
            export ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
            
            # Pull new image and restart services
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
